# wave_sd.conf: partition layout of the microSD card for the SD card build.
# Put it next to boot.img on partition 1 (FAT) of the card. Partition 1 is
# always the one FBOOT_*_SD loads boot.img from. Lines are <name>=<number>,
# missing lines keep the defaults shown here.

# ext4 partitions of Android
cache=2
system=3
data=4

# FAT or exFAT partition shown as the SD card in Android, 0 for none (the
# internal storage on /data is always there). Never 1: partition 1 holds
# boot.img and is /boot, storage=1 is ignored.
storage=0
